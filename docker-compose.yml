services:
  app:
    build: ./app/backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=postgres
      - JWT_SECRET=matcha_dev_jwt_secret_change_in_production_32chars
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USER=matcha@matcha.local
      - SMTP_PASS=

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    build: ./app/frontend/web-matcha
    ports:
      - "5173:5173"
    depends_on:
      - app
    command: npm run dev

volumes:
  db-data:
