volumes:
  matcha_db:
  matcha_minio:
  matcha_certs:

networks:
  matcha_net:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - matcha_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - matcha_net

  minio:
    build: ./minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - matcha_minio:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - matcha_net

  api:
    build: ./app/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
      API_PORT: 3000
      S3_ENDPOINT: http://minio:9000
    ports:
      - '${API_PORT:-3000}:3000'
    networks:
      - matcha_net

  # frontend:
  #   build: ./app/frontend-web
  #   restart: unless-stopped
  #   command: npm run dev -- --host 0.0.0.0
  #   networks:
  #     - matcha_net

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - api
      - minio
      # - frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - matcha_certs:/etc/nginx/certs
    networks:
      - matcha_net
