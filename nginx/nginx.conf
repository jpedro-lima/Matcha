events {}

http {
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    upstream api   { server api:3000; }
    upstream minio { server minio:9000; }
    # upstream frontend { server frontend:5173; }

    # Cache para /uploads/. Fotos são imutáveis por key (UUID), então pode ser
    # agressivo. 1 GB de teto, 7 dias inativos, expurgo automático.
    proxy_cache_path /var/cache/nginx/uploads
        levels=1:2
        keys_zone=uploads_cache:10m
        max_size=1g
        inactive=7d
        use_temp_path=off;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
        }

        location /uploads/ {
            proxy_pass http://minio/matcha-photos/;
            proxy_set_header Host $host;
            proxy_cache uploads_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Cache-Status $upstream_cache_status always;
            access_log off;
        }

        # Frontend (Vite dev server with HMR) — re-enable when the
        # `frontend` service is uncommented in docker-compose.yml.
        # location / {
        #     proxy_pass http://frontend;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade    $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host       $host;
        #     proxy_set_header X-Real-IP  $remote_addr;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }
}
